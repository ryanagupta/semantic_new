# Install under /etc/nginx/sites-available/relay. The bootstrap script replaces
# __RELAY_DOMAIN__, then Certbot adds and maintains the TLS listener.
limit_req_zone $binary_remote_addr zone=relay_edge:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=relay_login:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=relay_connections:10m;
map $http_upgrade $relay_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __RELAY_DOMAIN__;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn relay_connections 30;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=relay_edge burst=120 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite untrusted forwarding and internal identity headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Relay-Scraper-Identity "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;
    proxy_buffering off;
    proxy_cache off;

    # The Next BFF verifies the account session and signs the owner association.
    # Never send scraper management requests directly to the gateway listener.
    location = /api/scrapers {
        proxy_pass http://127.0.0.1:3000;
    }
    location ^~ /api/scrapers/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 300s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
    location ^~ /api/v1/custom/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 25s;
    }
    location ^~ /api/auth/ {
        limit_req zone=relay_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location ~ ^/(mcp|sse|messages|gateway)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 300s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $relay_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Relay-Scraper-Identity "";
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
